<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de gastos</title>
<meta name="theme-color" content="#1D5A45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#EFF2EE; --sup:#FFFFFF; --sup-2:#E2E8E3; --tinta:#13201A; --tinta-2:#55665D; --linha:#D3DBD5;
  --acao:#1D5A45; --acao-hover:#174A39; --acao-tinta:#F4FAF6;
  --alerta:#B3261E; --alerta-fundo:#FBEAE8; --ok:#1D5A45; --aviso:#8A5A00;
  --veu:rgba(10,20,15,.45); --sombra:0 -8px 30px rgba(10,20,15,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --papel:#0E1512; --sup:#17211C; --sup-2:#223029; --tinta:#E5EDE8; --tinta-2:#98AAA0; --linha:#2B3A33;
    --acao:#6FC79F; --acao-hover:#86D4B0; --acao-tinta:#0B1A13;
    --alerta:#F08A7E; --alerta-fundo:#3A1D1A; --ok:#6FC79F; --aviso:#E2B45A;
    --veu:rgba(0,0,0,.6); --sombra:0 -8px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
html{-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.travado{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acao);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
ul{list-style:none;margin:0;padding:0}

#app{max-width:560px;margin:0 auto;padding:12px 18px 40px}

.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 16px}
.marca{font-size:15px;font-weight:700;color:var(--tinta-2);margin:0}
.quem{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linha);background:var(--sup);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600}
.quem .trocar{color:var(--tinta-2);font-weight:500;font-size:14px}

.avatar{width:40px;height:40px;border-radius:50%;background:var(--av);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.avatar.mini{width:28px;height:28px;font-size:14px}

.abas{display:flex;gap:4px;background:var(--sup-2);border-radius:12px;padding:4px;margin-bottom:18px}
.aba{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--tinta-2)}
.aba[aria-current="page"]{background:var(--sup);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.hero{padding:6px 0 16px}
.rotulo{margin:0;font-size:15px;color:var(--tinta-2);font-weight:500}
.grande{margin:4px 0 6px;font-size:clamp(54px,17vw,86px);line-height:.95;font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.grande .moeda{font-size:.36em;font-weight:700;vertical-align:1.15em;margin-right:.14em}
.grande .cent{font-size:.5em}
.grande.neg{color:var(--alerta)}
.de{margin:0 0 14px;color:var(--tinta-2);font-size:15px}
.trilho{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sup-2)}
.trilho span{display:block;height:100%;min-width:3px}
.trilho span+span{border-left:2px solid var(--papel)}

.primario{background:var(--acao);color:var(--acao-tinta);border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:17px}
.primario:hover:not(:disabled){background:var(--acao-hover)}
.primario:disabled{opacity:.45;cursor:not-allowed}
.secundario{background:transparent;color:var(--tinta);border:1.5px solid var(--linha);border-radius:12px;padding:11px 16px;font-weight:600}
.largo{display:block;width:100%;margin:10px 0}
.voltar{background:none;border:0;padding:6px 0;color:var(--acao);font-weight:600;margin-bottom:4px}

.secao{font-size:20px;font-weight:700;margin:28px 0 10px;letter-spacing:-.01em}
.apoio{color:var(--tinta-2);margin:0 0 14px;max-width:48ch;font-size:15px}
.vazio{color:var(--tinta-2);font-size:15px;padding:6px 0;margin:0}
.rodape{margin:36px 0 0;font-size:13px;color:var(--tinta-2);text-align:center}
.centro{padding:60px 0;text-align:center;color:var(--tinta-2)}

/* envelopes */
.envelopes{background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:2px 16px}
.env{padding:14px 0;border-top:1px solid var(--linha)}
.env:first-child{border-top:0}
.env-linha{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.env-nome{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;min-width:0}
.pino{width:10px;height:10px;border-radius:3px;flex:none}
.env-sobra{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.env-sobra small{font-weight:500;color:var(--tinta-2);font-size:13px}
.env-sobra.sem{font-weight:500;color:var(--tinta-2);font-size:14px}
.env.passou .env-sobra,.env.esgotado .env-sobra{color:var(--alerta)}
.env.quase .env-nota{color:var(--aviso)}
.barra{height:8px;border-radius:4px;background:var(--sup-2);margin:8px 0 6px;overflow:hidden}
.barra span{display:block;height:100%;border-radius:4px}
.env-nota{margin:0;font-size:14px;color:var(--tinta-2)}

/* histórico */
.gasto{padding:12px 0;border-top:1px solid var(--linha)}
.gasto:first-child{border-top:0}
.g-l1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.g-desc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-valor{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.g-l2{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:14px;color:var(--tinta-2);flex-wrap:wrap}
.g-meta{margin-right:auto}
.cartao-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.mini-c{position:relative;width:22px;height:15px;border-radius:3px;background:var(--cf);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.mini-c::after{content:"";position:absolute;left:3px;top:4px;width:5px;height:4px;border-radius:1px;background:#D8B45A}
.g-apagar,.x{background:none;border:0;color:var(--alerta);font-size:13px;font-weight:600;padding:4px 0}
.armado{text-decoration:underline}

/* família */
.linha-pessoa{width:100%;display:flex;align-items:center;gap:14px;background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:14px;text-align:left;margin-bottom:10px}
.lp-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lp-nome{font-weight:700;font-size:18px}
.lp-sub{font-size:14px;color:var(--tinta-2);margin-bottom:6px}
.lp-txt .trilho{height:8px}
.lp-ir{font-size:26px;color:var(--tinta-2);line-height:1}

/* entrada */
.titulo{font-size:clamp(42px,12vw,62px);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;line-height:1;margin:22px 0 12px;letter-spacing:-.02em}
.perfis{display:grid;gap:10px;margin-top:18px}
.perfil{width:100%;display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1px solid var(--linha);background:var(--sup);text-align:left}
.perfil .avatar{width:52px;height:52px;font-size:22px}
.perfil-txt{display:flex;flex-direction:column}
.perfil-txt b{font-size:19px}
.perfil-txt small{color:var(--tinta-2);font-size:14px}

/* folha (bottom sheet) */
.veu{position:fixed;inset:0;background:var(--veu);z-index:40}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sup);border-radius:20px 20px 0 0;box-shadow:var(--sombra);padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow-y:auto;max-width:560px;margin:0 auto;animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.folha{animation:none}#toast{transition:none}}
.folha-topo{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.folha-topo h2{margin:0;font-size:22px}
.fechar{background:var(--sup-2);border:0;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1}
.para{margin:0 0 8px;color:var(--tinta-2)}
.campo-valor{display:block;margin:6px 0 16px}
.cv-rot,.campo>span,legend{display:block;font-size:14px;font-weight:600;color:var(--tinta-2);margin-bottom:6px;padding:0}
.cv-in{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--linha);padding:2px 0}
.cv-in:focus-within{border-color:var(--acao)}
.cv-in span{font-size:22px;font-weight:700;color:var(--tinta-2)}
.cv-in input{flex:1;min-width:0;border:0;background:transparent;font-size:42px;font-weight:800;font-variation-settings:"wdth" 75;outline:none;font-variant-numeric:tabular-nums;padding:0}
fieldset{border:0;padding:0;margin:0 0 14px;min-width:0}
.op-cats{display:flex;flex-wrap:wrap;gap:8px}
.op-cat,.op-cartao,.estilo{position:relative}
.op-cat input,.op-cartao input,.estilo input{position:absolute;opacity:0;pointer-events:none}
.op-in{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1.5px solid var(--linha);border-radius:10px;background:var(--papel);cursor:pointer}
.op-nome{font-weight:600}
.op-sobra{font-size:12.5px;color:var(--tinta-2)}
.op-cat input:checked+.op-in{border-color:var(--acao);background:var(--sup);box-shadow:inset 0 0 0 1px var(--acao)}
.op-cat input:focus-visible+.op-in{outline:2px solid var(--acao);outline-offset:2px}
.op-cartoes{display:flex;gap:12px;overflow-x:auto;padding:6px 6px 10px}
.op-cartao{cursor:pointer}
.op-cartao input:checked+.cartao{outline:3px solid var(--acao);outline-offset:3px}
.op-cartao input:focus-visible+.cartao{outline:3px dashed var(--acao);outline-offset:3px}
.cartao{position:relative;display:flex;flex-direction:column;justify-content:flex-end;width:132px;aspect-ratio:1.586;border-radius:10px;background:var(--cf);color:var(--ct);padding:10px;flex:none;font-weight:700;font-size:14px;line-height:1.15;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cartao .chip{position:absolute;top:12px;left:10px;width:22px;height:16px;border-radius:3px;background:linear-gradient(135deg,#E9CE7A,#B8923A)}
.check{min-height:1.4em;margin:6px 0;font-size:15px;color:var(--tinta-2)}
.check.erro{color:var(--alerta);font-weight:600}
.check.ok{color:var(--ok);font-weight:600}
.campo{display:block;margin-bottom:12px}
.campo input,.aj-campos input,.aj-add input,#novo-cartao{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--linha);border-radius:10px;background:var(--papel);font-size:16px}

/* ajustes */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg-b{border:1.5px solid var(--linha);background:var(--sup);border-radius:999px;padding:8px 16px;font-weight:600}
.seg-b[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.aj-cats{padding:2px 14px;margin:12px 0;background:var(--sup);border:1px solid var(--linha);border-radius:16px}
.aj-cat{display:grid;grid-template-columns:28px minmax(0,1fr) 124px;grid-template-areas:"cor nome valor" ". gasto x";gap:4px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--linha)}
.aj-cat:first-child{border-top:0}
.cor-b{grid-area:cor;width:28px;height:28px;border-radius:8px;border:0}
.aj-nome{grid-area:nome;min-width:0;border:0;border-bottom:1.5px solid transparent;background:transparent;font-weight:600;font-size:16px;padding:6px 2px}
.aj-nome:hover,.aj-nome:focus{border-bottom-color:var(--linha);outline:none}
.aj-valor{grid-area:valor;display:flex;align-items:center;gap:4px;border:1.5px solid var(--linha);border-radius:10px;padding:0 8px;background:var(--papel)}
.aj-valor:focus-within{border-color:var(--acao)}
.aj-valor span{color:var(--tinta-2);font-size:14px}
.aj-valor input{width:100%;min-width:0;border:0;background:transparent;padding:9px 0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;outline:none}
.aj-gasto{grid-area:gasto;margin:0;font-size:13px;color:var(--tinta-2)}
.aj-cat .x{grid-area:x;justify-self:end}
.aj-add{display:flex;gap:8px}
.aj-add input{flex:1;min-width:0;background:var(--sup)}
.aj-total{font-size:16px;margin:16px 0}
.aj-total b{font-variant-numeric:tabular-nums}
.aj-campos{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:6px}
.aj-campos label,.rot-campo{font-size:14px;font-weight:600;color:var(--tinta-2);display:flex;flex-direction:column;gap:6px}
.aj-cartoes{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 16px}
.aj-cartoes li{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.aj-novo-cartao{background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:14px;display:grid;gap:12px}
.estilos{display:flex;gap:10px;flex-wrap:wrap}
.estilo{display:block;cursor:pointer}
.estilo .amostra{display:block;width:36px;height:24px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.estilo input:checked+.amostra{outline:2.5px solid var(--acao);outline-offset:2px}
.estilo input:focus-visible+.amostra{outline:2.5px dashed var(--acao);outline-offset:2px}

/* toast */
#toast{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:none}
.t-pilula{background:var(--tinta);color:var(--papel);padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:480px}
.t-pilula.erro{background:var(--alerta);color:var(--papel)}

@media (max-width:380px){
  .aj-cat{grid-template-columns:28px minmax(0,1fr) 104px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="folha-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

/* ============================================================
   CONFIGURAÇÃO: cole aqui os dois valores do seu projeto Supabase
   (Project Settings > API). A chave "anon" é pública por natureza:
   quem protege os dados são as regras do banco (supabase.sql).
   Nunca cole a chave "service_role" aqui.
   ============================================================ */
var SUPABASE_URL = 'https://zlgnvlatglbqniaahqyw.supabase.co';
var SUPABASE_ANON_KEY = 'CeyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsZ252bGF0Z2xicW5pYWFocXl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNTUzNTksImV4cCI6MjEwODYzMTM1OX0.I3FKyKUfXd_wCz34mTHU5b6XE6-K8TtbNc9_O-Qw90g';

var CONFIGURADO = SUPABASE_URL.indexOf('COLE_AQUI') < 0 && SUPABASE_ANON_KEY.indexOf('COLE_AQUI') < 0;
var sb = null;
if(CONFIGURADO && window.supabase && typeof window.supabase.createClient === 'function'){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

var CORES = {
  roxo:['Roxo','#7457A0'], vermelho:['Vermelho','#C2412D'], amarelo:['Amarelo','#C9961A'],
  laranja:['Laranja','#C66A28'], azul:['Azul','#2F5E9E'], verde:['Verde','#2E7D5B'],
  cinza:['Cinza','#5F7D8C'], sepia:['Sépia','#8A7356']
};
var ORDEM_CORES = Object.keys(CORES);
var ESTILOS = {
  grafite:{nome:'Grafite',fundo:'#26272B',tinta:'#DADBDF'},
  amarelo:{nome:'Amarelo',fundo:'#F5CC1F',tinta:'#1D3A8A'},
  roxo:{nome:'Roxo',fundo:'#5B2A86',tinta:'#F1E8FA'},
  laranja:{nome:'Laranja',fundo:'#E8641B',tinta:'#FFF4EC'},
  azul:{nome:'Azul',fundo:'#1E4E9C',tinta:'#EAF1FF'},
  verde:{nome:'Verde',fundo:'#1F6B4F',tinta:'#E6F4EC'},
  vermelho:{nome:'Vermelho',fundo:'#B4232A',tinta:'#FFECEC'},
  prata:{nome:'Prata',fundo:'#C9CDD2',tinta:'#23262B'}
};
var CORES_AVATAR = ['#1D5A45','#7457A0','#C2412D','#2F5E9E','#C66A28','#5F7D8C'];
var MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

var S = {
  cfg:{pessoas:[], cartoes:[]}, gastos:[],
  iniciando:true, sessao:null, email:'', carregado:false, erroCarga:'',
  aba:'familia', pessoaAberta:null, ajPessoa:null, rascunho:null,
  folha:null, histLimite:15, renderPendente:false, salvando:false
};

/* ---------- utilidades ---------- */
function $(sel){ return document.querySelector(sel); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uuid(){
  if(window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){ var r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); });
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var NF = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function fmt(c){ return NF.format((c||0)/100); }
function fmtNum(c){ return ((c||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtGrande(c){
  var neg = c < 0, abs = Math.abs(c||0);
  var int = Math.floor(abs/100), cent = String(abs % 100).padStart(2,'0');
  return (neg ? '−' : '') + '<span class="moeda">R$</span>' + int.toLocaleString('pt-BR') + '<span class="cent">,' + cent + '</span>';
}
function parseValor(t){
  var s = String(t == null ? '' : t).trim().replace(/R\$|\s/g,'');
  if(!s) return NaN;
  if(s.indexOf(',') >= 0) s = s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  if(!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return Math.round(parseFloat(s)*100);
}
function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtData(iso){
  if(!iso) return '';
  var p = iso.split('-').map(Number);
  if(p.length !== 3 || !p[1]) return iso;
  var s = p[2] + ' ' + MESES[p[1]-1];
  if(p[0] !== new Date().getFullYear()) s += ' ' + p[0];
  return s;
}
function cor(k){ return (CORES[k] || CORES.cinza)[1]; }
function inicial(n){ return (String(n||'').trim().charAt(0) || '?').toUpperCase(); }

/* ---------- dados ---------- */
function pessoa(id){ return S.cfg.pessoas.filter(function(p){ return p.id === id; })[0] || null; }
function pessoaSessao(){ return S.sessao ? pessoa(S.sessao) : null; }
function admin(){ return S.cfg.pessoas.filter(function(p){ return p.papel === 'admin'; })[0] || null; }
function nomeAdmin(){ var a = admin(); return a ? a.nome : 'O administrador'; }
function cartao(id){ return S.cfg.cartoes.filter(function(c){ return c.id === id; })[0] || null; }
function corAvatar(p){ var i = S.cfg.pessoas.indexOf(p); return CORES_AVATAR[(i < 0 ? 0 : i) % CORES_AVATAR.length]; }

function resumo(p){
  var gs = S.gastos.filter(function(g){ return g.pessoaId === p.id; }).sort(function(a,b){
    return (b.data || '').localeCompare(a.data || '') || (b.criadoEm - a.criadoEm);
  });
  var por = {}, gasto = 0;
  gs.forEach(function(g){ por[g.categoriaId] = (por[g.categoriaId] || 0) + g.valor; gasto += g.valor; });
  var cats = p.categorias.map(function(c){
    var gc = por[c.id] || 0;
    return {id:c.id, nome:c.nome, limite:c.limite, cor:c.cor, gasto:gc, sobra:c.limite - gc};
  });
  var limite = cats.reduce(function(s,c){ return s + c.limite; }, 0);
  return {cats:cats, limite:limite, gasto:gasto, sobra:limite - gasto, gastos:gs};
}

/* ---------- pessoa escolhida neste aparelho ---------- */
var LS_PESSOA = 'cg-pessoa-v1';
function lerSessao(){ try{ return localStorage.getItem(LS_PESSOA) || null; }catch(e){ return null; } }
function guardarSessao(id){ try{ if(id) localStorage.setItem(LS_PESSOA, id); else localStorage.removeItem(LS_PESSOA); }catch(e){} }

/* ---------- Supabase: leitura ---------- */
function mapCfg(ps, cs, cartoes){
  return {
    pessoas:ps.map(function(p){
      return {
        id:p.id, nome:p.nome || 'Sem nome', papel:p.papel === 'admin' ? 'admin' : 'membro',
        categorias:cs.filter(function(c){ return c.pessoa_id === p.id; }).map(function(c){
          return {id:c.id, nome:c.nome, limite:Number(c.limite_centavos) || 0, cor:CORES[c.cor] ? c.cor : 'cinza'};
        })
      };
    }),
    cartoes:cartoes.map(function(c){ return {id:c.id, nome:c.nome, estilo:ESTILOS[c.estilo] ? c.estilo : 'prata'}; })
  };
}
function mapGasto(g){
  return {
    id:g.id, pessoaId:g.pessoa_id, categoriaId:g.categoria_id, cartaoId:g.cartao_id || '',
    valor:Number(g.valor_centavos) || 0, descricao:g.descricao || '', data:g.data || '',
    criadoEm:Date.parse(g.criado_em) || 0, criadoPor:g.criado_por || ''
  };
}
function carregar(){
  if(!sb) return Promise.resolve();
  return Promise.all([
    sb.from('pessoas').select('id,nome,papel,ordem').order('ordem'),
    sb.from('categorias').select('id,pessoa_id,nome,limite_centavos,cor,ordem').order('ordem'),
    sb.from('cartoes').select('id,nome,estilo').order('nome'),
    sb.from('gastos').select('id,pessoa_id,categoria_id,cartao_id,valor_centavos,descricao,data,criado_em,criado_por').order('data',{ascending:false}).limit(5000)
  ]).then(function(rs){
    for(var i = 0; i < rs.length; i++){ if(rs[i].error) throw rs[i].error; }
    S.cfg = mapCfg(rs[0].data || [], rs[1].data || [], rs[2].data || []);
    S.gastos = (rs[3].data || []).map(mapGasto);
    S.carregado = true; S.erroCarga = '';
    if(S.sessao && !pessoa(S.sessao)){ S.sessao = null; guardarSessao(null); }
    agendarRender();
  }).catch(function(e){
    if(window.console) console.warn(e);
    S.carregado = true;
    if(S.cfg.pessoas.length){ toast('Não foi possível atualizar. Verifique a conexão.', true); }
    else { S.erroCarga = 'Não foi possível carregar os dados. Verifique a conexão e tente de novo.'; agendarRender(); }
  });
}

/* ---------- Supabase: escrita ---------- */
function msgErro(e){
  var m = (e && e.message) || '';
  if(m.indexOf('limite_excedido') >= 0) return 'Esse valor passa do limite da categoria. Os saldos foram atualizados.';
  if(m.indexOf('sem_limite') >= 0) return 'Essa categoria ainda não tem limite definido.';
  if(m.indexOf('categoria_invalida') >= 0) return 'Categoria inválida para essa pessoa.';
  if(m.indexOf('violates row-level security') >= 0) return 'Seu acesso não permite fazer isso.';
  if(m.indexOf('foreign key') >= 0) return 'Esse item está em uso e não pode ser removido.';
  return 'Não foi possível salvar. Tente de novo.';
}
function erroDb(e){ if(window.console) console.warn(e); toast(msgErro(e), true); }
function checar(r){ if(r && r.error) throw r.error; return r; }

function gravarGasto(g){
  return sb.from('gastos').insert({
    id:g.id, pessoa_id:g.pessoaId, categoria_id:g.categoriaId, cartao_id:g.cartaoId || null,
    valor_centavos:g.valor, descricao:g.descricao, data:g.data, criado_por:S.sessao
  }).then(function(r){
    if(r.error){ erroDb(r.error); carregar(); return false; }
    return carregar().then(function(){ return true; });
  });
}
function apagarGasto(id){
  sb.from('gastos').delete().eq('id', id).then(function(r){
    if(r.error){ erroDb(r.error); return; }
    carregar().then(function(){ toast('Gasto apagado.'); });
  });
}

/* ---------- pedaços de tela ---------- */
function barraEmpilhada(segs, total){
  if(!(total > 0)) return '<div class="trilho" aria-hidden="true"></div>';
  var spans = segs.filter(function(s){ return s.valor > 0; }).map(function(s){
    return '<span style="width:' + Math.min(100, s.valor/total*100).toFixed(2) + '%;background:' + s.cor + '"></span>';
  }).join('');
  return '<div class="trilho" aria-hidden="true">' + spans + '</div>';
}
function segmentosCats(r){ return r.cats.map(function(c){ return {valor:c.gasto, cor:cor(c.cor)}; }); }
function vHero(rotulo, r, vazioTxt, segs){
  return '<section class="hero">' +
    '<p class="rotulo">' + esc(rotulo) + '</p>' +
    '<p class="grande' + (r.sobra < 0 ? ' neg' : '') + '">' + fmtGrande(r.sobra) + '</p>' +
    '<p class="de">' + (r.limite > 0 ? 'de ' + fmt(r.limite) + ' liberados, ' + fmt(r.gasto) + ' já gastos' : esc(vazioTxt)) + '</p>' +
    barraEmpilhada(segs, r.limite) +
  '</section>';
}
function vCartaoGrande(c){
  var e = ESTILOS[c.estilo] || ESTILOS.prata;
  return '<span class="cartao" style="--cf:' + e.fundo + ';--ct:' + e.tinta + '"><span class="chip" aria-hidden="true"></span><span class="c-nome">' + esc(c.nome) + '</span></span>';
}
function tagCartao(id){
  var c = cartao(id);
  if(!c) return '<span class="cartao-tag">Cartão removido</span>';
  var e = ESTILOS[c.estilo] || ESTILOS.prata;
  return '<span class="cartao-tag"><span class="mini-c" style="--cf:' + e.fundo + '" aria-hidden="true"></span>' + esc(c.nome) + '</span>';
}
function vEnvelopes(r){
  if(!r.cats.length) return '<p class="vazio">Nenhuma categoria cadastrada.</p>';
  return '<ul class="envelopes">' + r.cats.map(function(c){
    var pct = c.limite > 0 ? Math.min(100, c.gasto/c.limite*100) : (c.gasto > 0 ? 100 : 0);
    var estado = '', dir, nota = '';
    if(c.limite === 0 && c.gasto === 0){ dir = '<span class="env-sobra sem">Sem limite definido</span>'; }
    else if(c.sobra < 0){ estado = 'passou'; dir = '<span class="env-sobra">Passou ' + fmt(-c.sobra) + '</span>'; }
    else if(c.sobra === 0){ estado = 'esgotado'; dir = '<span class="env-sobra">Esgotado</span>'; }
    else { if(pct >= 85) estado = 'quase'; dir = '<span class="env-sobra"><small>sobra </small>' + fmt(c.sobra) + '</span>'; }
    if(c.limite > 0) nota = 'Gastou ' + fmt(c.gasto) + ' de ' + fmt(c.limite) + (estado === 'quase' ? '. Perto do limite.' : '');
    else if(c.gasto > 0) nota = 'Gastou ' + fmt(c.gasto);
    return '<li class="env ' + estado + '">' +
      '<div class="env-linha"><span class="env-nome"><span class="pino" style="background:' + cor(c.cor) + '"></span>' + esc(c.nome) + '</span>' + dir + '</div>' +
      '<div class="barra"><span style="width:' + pct.toFixed(1) + '%;background:' + (estado === 'passou' ? 'var(--alerta)' : cor(c.cor)) + '"></span></div>' +
      (nota ? '<p class="env-nota">' + nota + '</p>' : '') +
    '</li>';
  }).join('') + '</ul>';
}
function vHistorico(r, podeApagar, p){
  if(!r.gastos.length) return '<p class="vazio">Nenhum gasto lançado ainda.</p>';
  function catNome(id){ var c = p.categorias.filter(function(x){ return x.id === id; })[0]; return c ? c.nome : 'Categoria removida'; }
  var lista = r.gastos.slice(0, S.histLimite);
  var h = '<ul class="historico">' + lista.map(function(g){
    var titulo = g.descricao || catNome(g.categoriaId);
    var meta = g.descricao ? catNome(g.categoriaId) + ', ' + fmtData(g.data) : fmtData(g.data);
    return '<li class="gasto">' +
      '<div class="g-l1"><span class="g-desc">' + esc(titulo) + '</span><span class="g-valor">' + fmt(g.valor) + '</span></div>' +
      '<div class="g-l2"><span class="g-meta">' + esc(meta) + '</span>' + tagCartao(g.cartaoId) +
        (podeApagar ? '<button class="g-apagar" data-acao="apagar-gasto" data-id="' + esc(g.id) + '">Apagar</button>' : '') +
      '</div></li>';
  }).join('') + '</ul>';
  if(r.gastos.length > S.histLimite) h += '<button class="secundario largo" data-acao="mais-hist">Ver mais gastos</button>';
  return h;
}

function vPessoa(p, o){
  var r = resumo(p), h = '';
  if(o.voltar) h += '<button class="voltar" data-acao="voltar">Voltar para a família</button>';
  var rot = o.proprio ? 'Sobra para você gastar' : 'Sobra para ' + p.nome;
  var vazio = o.proprio
    ? (p.papel === 'admin' ? 'Defina seus limites em Ajustes.' : nomeAdmin() + ' ainda não liberou valores para você.')
    : 'Nenhum limite definido para ' + p.nome + '.';
  h += vHero(rot, r, vazio, segmentosCats(r));
  h += '<button class="primario largo" data-acao="lancar" data-id="' + esc(p.id) + '">' + (o.proprio ? 'Lançar gasto' : 'Lançar gasto de ' + esc(p.nome)) + '</button>';
  if(o.admin) h += '<button class="secundario largo" data-acao="editar-limites" data-id="' + esc(p.id) + '">' + (o.proprio ? 'Editar meus limites' : 'Editar limites de ' + esc(p.nome)) + '</button>';
  h += '<h2 class="secao">Por categoria</h2>' + vEnvelopes(r);
  h += '<h2 class="secao">Gastos lançados</h2>' + vHistorico(r, !!o.admin, p);
  return h;
}
function vFamilia(){
  var rs = S.cfg.pessoas.map(function(p){ return [p, resumo(p)]; });
  var tot = {limite:0, gasto:0};
  rs.forEach(function(x){ tot.limite += x[1].limite; tot.gasto += x[1].gasto; });
  tot.sobra = tot.limite - tot.gasto;
  var segs = rs.map(function(x){ return {valor:x[1].gasto, cor:corAvatar(x[0])}; });
  var h = vHero('Sobra na família', tot, 'Nenhum limite definido ainda.', segs);
  if(tot.limite === 0) h += '<button class="primario largo" data-acao="aba" data-aba="ajustes">Definir limites</button>';
  h += '<h2 class="secao">Por pessoa</h2><ul>' + rs.map(function(x){
    var p = x[0], r = x[1];
    return '<li><button class="linha-pessoa" data-acao="abrir-pessoa" data-id="' + esc(p.id) + '">' +
      '<span class="avatar" style="--av:' + corAvatar(p) + '">' + esc(inicial(p.nome)) + '</span>' +
      '<span class="lp-txt"><span class="lp-nome">' + esc(p.nome) + '</span>' +
        '<span class="lp-sub">' + (r.limite > 0 ? 'Sobra ' + fmt(r.sobra) + ' de ' + fmt(r.limite) : 'Sem limites definidos') + '</span>' +
        barraEmpilhada(segmentosCats(r), r.limite) +
      '</span><span class="lp-ir" aria-hidden="true">›</span></button></li>';
  }).join('') + '</ul>';
  return h;
}
function rascunhoDe(p){
  return {
    id:p.id, nome:p.nome,
    categorias:p.categorias.map(function(c){ return {id:c.id, nome:c.nome, limite:c.limite, cor:c.cor, txt:c.limite ? fmtNum(c.limite) : ''}; })
  };
}
function totalRascunho(d){
  return d.categorias.reduce(function(s,c){ var v = parseValor(c.txt); return s + (v > 0 ? v : 0); }, 0);
}
function vAjustes(){

  if(!S.ajPessoa || !pessoa(S.ajPessoa)) S.ajPessoa = ps[0].id;
  var p = pessoa(S.ajPessoa);
  if(!S.rascunho || S.rascunho.id !== p.id) S.rascunho = rascunhoDe(p);
  var d = S.rascunho, r = resumo(p);

    }).join('') + '</div>' +
    '<p class="apoio">O valor é fixo: cada gasto desconta do limite da categoria até acabar. Para liberar mais dinheiro, aumente o limite.</p>' +

      var g = gastoCat(c.id);
      return '<li class="aj-cat">' +
        '<button class="cor-b" data-acao="cor-cat" data-id="' + esc(c.id) + '" style="background:' + cor(c.cor) + '" aria-label="Cor ' + CORES[c.cor][0] + '. Toque para trocar"></button>' +
        '<input class="aj-nome" data-rasc="cat-nome" data-id="' + esc(c.id) + '" value="' + esc(c.nome) + '" aria-label="Nome da categoria" maxlength="30">' +
        '<label class="aj-valor"><span>R$</span><input data-rasc="cat-limite" data-id="' + esc(c.id) + '" inputmode="decimal" value="' + esc(c.txt) + '" placeholder="0,00" aria-label="Limite de ' + esc(c.nome) + '"></label>' +
        '<p class="aj-gasto">' + (g > 0 ? 'Já gastou ' + fmt(g) + ' aqui' : 'Nada gasto ainda') + '</p>' +
        '<button class="x" data-acao="remover-cat" data-id="' + esc(c.id) + '">Remover</button>' +
      '</li>';
    }).join('') + '</ul>' : '<p class="vazio">Nenhuma categoria. Adicione a primeira abaixo.</p>') +
    '<div class="aj-add"><input id="nova-cat" placeholder="Nova categoria, ex.: Farmácia" maxlength="30" aria-label="Nova categoria"><button class="secundario" data-acao="add-cat">Adicionar</button></div>' +
    '<p class="aj-total">Total liberado para ' + esc(d.nome || p.nome) + ': <b id="aj-total">' + fmt(totalRascunho(d)) + '</b></p>' +
    '<div class="aj-campos"><label>Nome de exibição<input data-rasc="nome" value="' + esc(d.nome) + '" maxlength="24"></label></div>' +
    '<button class="primario largo" data-acao="salvar-pessoa">Salvar alterações de ' + esc(p.nome) + '</button>' +
  '</section>' +
  '<section>' +
    '<h2 class="secao">Cartões</h2>' +
    (S.cfg.cartoes.length ? '<ul class="aj-cartoes">' + S.cfg.cartoes.map(function(c){
      return '<li>' + vCartaoGrande(c) + '<button class="x" data-acao="remover-cartao" data-id="' + esc(c.id) + '">Remover</button></li>';
    }).join('') + '</ul>' : '<p class="vazio">Nenhum cartão cadastrado.</p>') +
    '<div class="aj-novo-cartao">' +
      '<label class="rot-campo">Nome do cartão<input id="novo-cartao" placeholder="Ex.: Nubank, Itaú Platinum" maxlength="24"></label>' +
      '<div class="rot-campo">Cor do cartão<div class="estilos" role="radiogroup" aria-label="Cor do cartão">' + Object.keys(ESTILOS).map(function(k){
        var e = ESTILOS[k];
        return '<label class="estilo"><input type="radio" name="estilo" value="' + k + '"' + (k === estiloInicial ? ' checked' : '') + '><span class="amostra" style="background:' + e.fundo + '"></span><span class="sr">' + e.nome + '</span></label>';
      }).join('') + '</div></div>' +
      '<button class="secundario" data-acao="add-cartao">Adicionar cartão</button>' +
    '</div>' +
  '</section>' +
  '<section>' +
    '<h2 class="secao">Pessoas</h2>' +
    '<div class="aj-add"><input id="nova-pessoa" placeholder="Nome da nova pessoa" maxlength="24" aria-label="Nome da nova pessoa"><button class="secundario" data-acao="add-pessoa">Adicionar</button></div>' +

  '</section>';

function vAdmin(p){
  var abas = [['familia','Família'],['meus','Meus gastos'],['ajustes','Ajustes']];
  var h = '<nav class="abas" aria-label="Seções">' + abas.map(function(a){
    return '<button class="aba" data-acao="aba" data-aba="' + a[0] + '" aria-current="' + (S.aba === a[0] && !S.pessoaAberta ? 'page' : 'false') + '">' + a[1] + '</button>';
  }).join('') + '</nav>';
  var aberta = S.pessoaAberta ? pessoa(S.pessoaAberta) : null;
  if(aberta) return h + vPessoa(aberta, {admin:true, voltar:true, proprio:aberta.id === p.id});
  if(S.aba === 'familia') return h + vFamilia();
  if(S.aba === 'meus') return h + vPessoa(p, {admin:true, proprio:true});
  return h + vAjustes();
}

/* ---------- render ---------- */
function editandoNoApp(){
  var a = document.activeElement, app = document.getElementById('app');
  return !!(a && app.contains(a) && a.matches('input,select,textarea'));
}
function agendarRender(){
  if(editandoNoApp()){ S.renderPendente = true; return; }
  render();
}
function render(){
  S.renderPendente = false;
  var app = document.getElementById('app');
  if(!CONFIGURADO){ app.innerHTML = vConfig(); return; }
  if(!sb){ app.innerHTML = vSemSupabase(); return; }
  if(S.erroCarga && !S.cfg.pessoas.length){ app.innerHTML = vErroCarga(); return; }
  if(!S.carregado){ app.innerHTML = vCarregando(); return; }
  var p = pessoaSessao();
  if(!p){ app.innerHTML = vEscolha(); return; }
  if(p.papel === 'admin') app.innerHTML = vTopo(p) + vAdmin(p) + vRodape();
  else app.innerHTML = vTopo(p) + vPessoa(p, {proprio:true}) + vRodape();
  atualizarCheck();
}

/* ---------- folha: lançar gasto ---------- */
function abrirFolha(pid){
  var p = pessoa(pid); if(!p) return;
  S.folha = {tipo:'gasto', pessoaId:pid};
  var r = resumo(p), eu = pessoaSessao();
  var cartoesHtml = S.cfg.cartoes.length
    ? '<div class="op-cartoes">' + S.cfg.cartoes.map(function(c){
        return '<label class="op-cartao"><input type="radio" name="f-cartao" value="' + esc(c.id) + '">' + vCartaoGrande(c) + '</label>';
      }).join('') + '</div>'
    : '<p class="apoio">Nenhum cartão cadastrado. ' + esc(nomeAdmin()) + ' cadastra em Ajustes.</p>';
  $('#folha-root').innerHTML =
    '<div class="veu" data-acao="fechar"></div>' +
    '<div class="folha" role="dialog" aria-modal="true" aria-labelledby="t-lancar">' +
      '<div class="folha-topo"><h2 id="t-lancar">Lançar gasto</h2><button class="fechar" data-acao="fechar" aria-label="Fechar">×</button></div>' +
      (eu && eu.id !== p.id ? '<p class="para">Em nome de ' + esc(p.nome) + '</p>' : '') +
      '<label class="campo-valor"><span class="cv-rot">Valor</span><span class="cv-in"><span>R$</span><input id="f-valor" inputmode="decimal" placeholder="0,00" autocomplete="off"></span></label>' +
      '<fieldset><legend>Categoria</legend><div class="op-cats">' + r.cats.map(function(c){
        return '<label class="op-cat"><input type="radio" name="f-cat" value="' + esc(c.id) + '"><span class="op-in"><span class="pino" style="background:' + cor(c.cor) + '"></span><span class="op-nome">' + esc(c.nome) + '</span><span class="op-sobra">' + (c.limite > 0 ? 'sobra ' + fmt(Math.max(0, c.sobra)) : 'sem limite') + '</span></span></label>';
      }).join('') + '</div></fieldset>' +
      '<fieldset><legend>Cartão</legend>' + cartoesHtml + '</fieldset>' +
      '<label class="campo"><span>Onde ou o quê (opcional)</span><input id="f-desc" maxlength="60" placeholder="Ex.: Renner, farmácia"></label>' +
      '<label class="campo"><span>Data</span><input id="f-data" type="date" value="' + hojeISO() + '"></label>' +
      '<p class="check" id="f-check" aria-live="polite"></p>' +
      '<button class="primario largo" id="f-salvar" data-acao="salvar-gasto" disabled>Lançar gasto</button>' +
    '</div>';
  if(S.cfg.cartoes.length === 1){ var u = document.querySelector('input[name="f-cartao"]'); if(u) u.checked = true; }
  document.body.classList.add('travado');
  atualizarCheck();
  setTimeout(function(){ var v = $('#f-valor'); if(v) v.focus(); }, 60);
}
function fecharFolha(){
  S.folha = null;
  $('#folha-root').innerHTML = '';
  document.body.classList.remove('travado');
}
function lerFormGasto(){
  var p = S.folha ? pessoa(S.folha.pessoaId) : null;
  if(!p) return null;
  var vEl = $('#f-valor');
  var catEl = document.querySelector('input[name="f-cat"]:checked');
  var carEl = document.querySelector('input[name="f-cartao"]:checked');
  var r = resumo(p);
  var c = catEl ? r.cats.filter(function(x){ return x.id === catEl.value; })[0] : null;
  return {
    p:p, txt:vEl ? vEl.value.trim() : '', valor:parseValor(vEl ? vEl.value : ''), c:c || null,
    cartaoId:carEl ? carEl.value : '', descricao:(($('#f-desc') || {}).value || '').trim(),
    data:(($('#f-data') || {}).value) || hojeISO()
  };
}
function validarGasto(f){
  if(!f) return {ok:false, msg:''};
  if(!f.txt) return {ok:false, msg:f.c && f.c.limite > 0 ? 'Sobram ' + fmt(Math.max(0, f.c.sobra)) + ' em ' + f.c.nome + '.' : ''};
  if(!(f.valor > 0)) return {ok:false, erro:true, msg:'Digite um valor válido, como 49,90.'};
  if(!f.c) return {ok:false, msg:'Escolha a categoria.'};
  if(f.c.limite <= 0) return {ok:false, erro:true, msg:f.c.nome + ' ainda não tem limite definido.'};
  if(f.valor > f.c.sobra) return {ok:false, erro:true, msg:f.c.sobra > 0 ? 'Passa do limite de ' + f.c.nome + '. Sobram só ' + fmt(f.c.sobra) + '.' : 'O limite de ' + f.c.nome + ' já acabou.'};
  if(!f.cartaoId) return {ok:false, msg:'Escolha o cartão usado.'};
  if(!cartao(f.cartaoId)) return {ok:false, erro:true, msg:'Esse cartão foi removido. Escolha outro.'};
  return {ok:true, msg:'Depois deste gasto, sobram ' + fmt(f.c.sobra - f.valor) + ' em ' + f.c.nome + '.'};
}
function atualizarCheck(){
  if(!S.folha || S.folha.tipo !== 'gasto') return;
  var el = $('#f-check'), btn = $('#f-salvar');
  if(!el || !btn) return;
  var v = validarGasto(lerFormGasto());
  el.textContent = v.msg || '';
  el.className = 'check' + (v.erro ? ' erro' : v.ok ? ' ok' : '');
  btn.disabled = !v.ok || S.salvando;
}
function salvarGasto(){
  var f = lerFormGasto(), v = validarGasto(f);
  if(!v.ok){ atualizarCheck(); return; }
  var btn = $('#f-salvar');
  S.salvando = true; btn.disabled = true; btn.textContent = 'Lançando…';
  var g = {
    id:uuid(), pessoaId:f.p.id, categoriaId:f.c.id, cartaoId:f.cartaoId, valor:f.valor,
    descricao:f.descricao, data:f.data
  };
  gravarGasto(g).then(function(ok){
    S.salvando = false;
    if(ok){ fecharFolha(); toast('Gasto lançado.'); }
    else if(btn.isConnected){ btn.textContent = 'Lançar gasto'; atualizarCheck(); }
  });
}

/* ---------- escolha de pessoa ---------- */
function entrar(id){
  if(!pessoa(id)) return;
  S.sessao = id; guardarSessao(id);
  S.aba = 'familia'; S.pessoaAberta = null; S.ajPessoa = null; S.rascunho = null; S.histLimite = 15;
  fecharFolha(); render(); window.scrollTo(0,0);
}
function trocarPessoa(){
  S.sessao = null; guardarSessao(null);
  S.pessoaAberta = null; S.rascunho = null;
  fecharFolha(); render(); window.scrollTo(0,0);
}

/* ---------- ações do admin ---------- */
function confirmarDuasVezes(b, fn){
  if(b.dataset.armado === '1'){ fn(); return; }
  var orig = b.textContent;
  b.dataset.armado = '1'; b.textContent = 'Confirmar'; b.classList.add('armado');
  setTimeout(function(){ if(b.isConnected){ b.dataset.armado = ''; b.textContent = orig; b.classList.remove('armado'); } }, 3500);
}
function trocarCor(b, id){
  var d = S.rascunho; if(!d) return;
  var c = d.categorias.filter(function(x){ return x.id === id; })[0]; if(!c) return;
  c.cor = ORDEM_CORES[(ORDEM_CORES.indexOf(c.cor) + 1) % ORDEM_CORES.length];
  b.style.background = cor(c.cor);
  b.setAttribute('aria-label', 'Cor ' + CORES[c.cor][0] + '. Toque para trocar');
}
function removerCat(id){
  var d = S.rascunho; if(!d) return;
  var c = d.categorias.filter(function(x){ return x.id === id; })[0];
  var tem = S.gastos.some(function(g){ return g.pessoaId === d.id && g.categoriaId === id; });
  if(tem){ toast((c ? c.nome : 'Essa categoria') + ' tem gastos lançados e não pode ser removida.', true); return; }
  d.categorias = d.categorias.filter(function(x){ return x.id !== id; });
  render();
  toast('Categoria removida. Salve para confirmar.');
}
function addCat(){
  var inp = $('#nova-cat'), d = S.rascunho;
  if(!inp || !d) return;
  var n = inp.value.trim();
  if(!n){ inp.focus(); return; }
  var usadas = d.categorias.map(function(c){ return c.cor; });
  var livre = ORDEM_CORES.filter(function(k){ return usadas.indexOf(k) < 0; })[0] || ORDEM_CORES[d.categorias.length % ORDEM_CORES.length];
  d.categorias.push({id:uuid(), nome:n, limite:0, cor:livre, txt:''});
  render();
  toast(n + ' adicionada. Defina o limite e salve.');
}
function salvarPessoa(){
  var d = S.rascunho; if(!d || S.salvando) return;
  var nome = d.nome.trim();
  if(!nome){ toast('Escreva o nome.', true); return; }
  var cats = [];
  for(var i = 0; i < d.categorias.length; i++){
    var c = d.categorias[i], n = c.nome.trim();
    if(!n){ toast('Há uma categoria sem nome.', true); return; }
    var t = (c.txt || '').trim(), v = t === '' ? 0 : parseValor(t);
    if(!(v >= 0)){ toast('Valor inválido em ' + n + '.', true); return; }
    cats.push({id:c.id, nome:n, limite:v, cor:c.cor});
  }
  var pid = d.id, atual = pessoa(pid);
  if(!atual) return;
  var manter = cats.map(function(c){ return c.id; });
  var remover = atual.categorias.map(function(c){ return c.id; }).filter(function(id){ return manter.indexOf(id) < 0; });
  var linhas = cats.map(function(c, i){ return {id:c.id, pessoa_id:pid, nome:c.nome, limite_centavos:c.limite, cor:c.cor, ordem:i}; });
  S.salvando = true;
  Promise.resolve(sb.from('pessoas').update({nome:nome}).eq('id', pid)).then(checar)
    .then(function(){ return linhas.length ? sb.from('categorias').upsert(linhas, {onConflict:'id'}) : {error:null}; }).then(checar)
    .then(function(){ return remover.length ? sb.from('categorias').delete().in('id', remover) : {error:null}; }).then(checar)
    .then(function(){ return carregar(); })
    .then(function(){ S.salvando = false; S.rascunho = null; render(); toast('Alterações salvas.'); })
    .catch(function(e){ S.salvando = false; erroDb(e); });
}
function addPessoa(){
  var inp = $('#nova-pessoa'); if(!inp) return;
  var n = inp.value.trim();
  if(!n){ inp.focus(); return; }
  Promise.resolve(sb.from('pessoas').insert({nome:n, papel:'membro', ordem:S.cfg.pessoas.length})).then(checar)
    .then(function(){ return carregar(); })
    .then(function(){ S.ajPessoa = null; S.rascunho = null; render(); toast(n + ' adicionada.'); })
    .catch(erroDb);
}
function addCartao(){
  var inp = $('#novo-cartao'); if(!inp) return;
  var n = inp.value.trim();
  if(!n){ inp.focus(); toast('Escreva o nome do cartão.', true); return; }
  var est = (document.querySelector('input[name="estilo"]:checked') || {}).value || 'prata';
  Promise.resolve(sb.from('cartoes').insert({nome:n, estilo:est})).then(checar)
    .then(function(){ return carregar(); })
    .then(function(){ render(); toast('Cartão ' + n + ' adicionado.'); })
    .catch(erroDb);
}
function removerCartao(id){
  Promise.resolve(sb.from('cartoes').delete().eq('id', id)).then(checar)
    .then(function(){ return carregar(); })
    .then(function(){ render(); toast('Cartão removido.'); })
    .catch(erroDb);
}

var tTimer = null;
function toast(msg, erro){
  var t = $('#toast');
  t.innerHTML = '<span class="t-pilula' + (erro ? ' erro' : '') + '">' + esc(msg) + '</span>';
  t.classList.add('on');
  clearTimeout(tTimer);
  tTimer = setTimeout(function(){ t.classList.remove('on'); }, 3200);
}

/* ---------- eventos ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-acao]'); if(!b) return;
  var a = b.dataset.acao, id = b.dataset.id;
  switch(a){
    case 'entrar': entrar(id); break;
    case 'trocar': trocarPessoa(); break;
    case 'add-pessoa': addPessoa(); break;
    case 'recarregar': S.erroCarga = ''; S.carregado = false; render(); carregar(); break;
    case 'recarregar-pagina': location.reload(); break;
    case 'aba': S.aba = b.dataset.aba; S.pessoaAberta = null; S.histLimite = 15; render(); window.scrollTo(0,0); break;
    case 'abrir-pessoa': S.pessoaAberta = id; S.histLimite = 15; render(); window.scrollTo(0,0); break;
    case 'voltar': S.pessoaAberta = null; render(); break;
    case 'editar-limites': S.pessoaAberta = null; S.aba = 'ajustes'; S.ajPessoa = id; S.rascunho = null; render(); window.scrollTo(0,0); break;
    case 'lancar': abrirFolha(id); break;
    case 'fechar': fecharFolha(); break;
    case 'salvar-gasto': salvarGasto(); break;
    case 'apagar-gasto': confirmarDuasVezes(b, function(){ apagarGasto(id); }); break;
    case 'mais-hist': S.histLimite += 20; render(); break;
    case 'aj-pessoa': S.ajPessoa = id; S.rascunho = null; render(); break;
    case 'cor-cat': trocarCor(b, id); break;
    case 'remover-cat': removerCat(id); break;
    case 'add-cat': addCat(); break;
    case 'salvar-pessoa': salvarPessoa(); break;
    case 'remover-cartao': confirmarDuasVezes(b, function(){ removerCartao(id); }); break;
    case 'add-cartao': addCartao(); break;
  }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.matches('[data-rasc]') && S.rascunho){
    var k = t.dataset.rasc, d = S.rascunho;
    if(k === 'nome') d.nome = t.value;
    else {
      var c = d.categorias.filter(function(x){ return x.id === t.dataset.id; })[0];
      if(!c) return;
      if(k === 'cat-nome') c.nome = t.value;
      if(k === 'cat-limite'){ c.txt = t.value; var tot = $('#aj-total'); if(tot) tot.textContent = fmt(totalRascunho(d)); }
    }
    return;
  }
  if(t.closest('#folha-root')) atualizarCheck();
});
document.addEventListener('change', function(e){ if(e.target.closest('#folha-root')) atualizarCheck(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && S.folha){ fecharFolha(); return; }
  if(e.key !== 'Enter') return;
  var id = e.target && e.target.id;
  if(id === 'nova-cat'){ e.preventDefault(); addCat(); }
  else if(id === 'novo-cartao'){ e.preventDefault(); addCartao(); }
  else if(id === 'nova-pessoa'){ e.preventDefault(); addPessoa(); }
});
document.addEventListener('focusout', function(){
  setTimeout(function(){ if(S.renderPendente && !editandoNoApp()) render(); }, 0);
});
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && sb && S.carregado && !S.folha && !S.rascunho && !editandoNoApp()) carregar();
});

/* ---------- início ---------- */
S.sessao = lerSessao();
render();
if(sb) carregar();
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
</html>
